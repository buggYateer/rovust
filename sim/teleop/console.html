<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark light">
<title>Rovust console</title>
<link rel="icon" type="image/png" href="/icon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#141a1f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rovust">
<!-- web fonts when the device is online; the system fonts below take over on an offline LAN -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
  /* Landscape: the rover's map fills the glass, the controls float at the thumbs (joystick bottom-left, STOP bottom-right).
     Portrait: header, map in the upper part, a control deck below with the joystick in the middle.
     The physical layout never mirrors; only text flips in Arabic. */
  :root {
    --bg: #141a1f; --surface: #1e262d; --surface-2: #26303a; --line: #2f3b46;
    --text: #e6edf3; --muted: #8b9aa7; --faint: #5d6b77;
    --teal: #2dd4bf; --amber: #f5a524; --red: #ef4444; --green: #4ade80; --rover: #fb923c;
    --glass: rgba(20, 26, 31, .78); --glass-line: rgba(230, 237, 243, .10); --glass-solid: rgba(20, 26, 31, .96);
    --chip: rgba(255, 255, 255, .06); --knob: #e6edf3; --stickbg: rgba(20, 26, 31, .80); --mapbg: #10161b;
    --hud: "Chakra Petch", "Bahnschrift", "Segoe UI", system-ui, sans-serif;
    --ui: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    --ar: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, "Noto Sans Arabic", sans-serif;
    --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
    --gut: max(10px, env(safe-area-inset-left, 0px)); --gutr: max(10px, env(safe-area-inset-right, 0px));
    --stick: 172px; --stop: 92px; --round: 58px;
  }
  :root[data-theme="light"] {
    --bg: #e9edf1; --surface: #ffffff; --surface-2: #eef2f5; --line: #d5dde4;
    --text: #141a1f; --muted: #5c6b78; --faint: #8b9aa7;
    --teal: #0f9d8a; --amber: #d97706; --red: #dc2626; --green: #16a34a;
    --glass: rgba(255, 255, 255, .88); --glass-line: rgba(20, 26, 31, .12); --glass-solid: rgba(255, 255, 255, .98);
    --chip: rgba(20, 26, 31, .06); --knob: #141a1f; --stickbg: rgba(255, 255, 255, .86); --mapbg: #2a333c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; background: var(--bg); color: var(--text); }
  body { font: 14px/1.4 var(--ui); user-select: none; -webkit-user-select: none; touch-action: none; }
  :lang(ar) body, [dir="rtl"] { font-family: var(--ar); }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; }
  button:active { transform: scale(.95); }
  button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  * { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }

  .glass { background: var(--glass); border: 1px solid var(--glass-line); }
  /* blur only where it is cheap: a mouse-driven computer. On phones and tablets it is re-composited on every map redraw. */
  @media (pointer: fine) { .glass { backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); } }

  .screen { position: fixed; inset: 0; overflow: hidden; direction: ltr; }
  .mapwrap { position: absolute; inset: 0; overflow: hidden; }
  #map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* ---------------------------------------------------------------- header */
  .topbar { position: absolute; top: max(8px, var(--st)); left: var(--gut); right: var(--gutr); min-height: 44px; border-radius: 14px;
    display: flex; flex-wrap: nowrap; align-items: center; column-gap: 10px; row-gap: 6px; padding: 5px 6px 5px 12px; z-index: 4; }
  .topbar > * { flex: none; }
  .brand { order: 1; font: 700 15px var(--hud); letter-spacing: .04em; white-space: nowrap; }
  .brand small { font: 500 12px var(--ui); color: var(--muted); margin-inline-start: 6px; letter-spacing: 0; }
  :lang(ar) .brand small { font-family: var(--ar); }
  .pill { order: 2; font: 600 12px var(--hud); letter-spacing: .06em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; background: rgba(45, 212, 191, .14); color: var(--teal);
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
  :lang(ar) .pill { font-family: var(--ar); letter-spacing: 0; text-transform: none; }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
  .pill.warn { background: rgba(245, 165, 36, .16); color: var(--amber); }
  .pill.bad { background: rgba(239, 68, 68, .16); color: var(--red); }
  .pill.idle { background: rgba(139, 154, 167, .14); color: var(--muted); }
  /* the current alert: a short chip in the header, never anything that pops up */
  .achip { order: 3; display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 8px; border-radius: 8px; font-weight: 600; font-size: 12.5px; white-space: nowrap;
    max-width: 230px; min-width: 0; background: var(--chip); color: var(--text); flex: 0 1 auto; }
  .achip[dir="rtl"] { font: 600 13px var(--ar); }
  .achip span { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .achip svg { width: 14px; height: 14px; flex: none; }
  .achip.warn { background: rgba(245, 165, 36, .18); color: var(--amber); }
  .achip.bad { background: rgba(239, 68, 68, .2); color: var(--red); }
  .achip.info { background: var(--chip); color: var(--text); }
  .achip button { border: 0; border-radius: 6px; padding: 2px 7px; background: var(--amber); color: #141a1f; font-weight: 600; font-size: 11.5px; cursor: pointer; flex: none; }
  .achip .more { font: 600 10.5px var(--hud); background: var(--chip); border-radius: 5px; padding: 0 5px; flex: none; direction: ltr; unicode-bidi: isolate; }
  .spacer { order: 4; flex: 1 1 0; min-width: 0; }
  .meter { display: flex; align-items: center; gap: 6px; font: 600 13px var(--hud); white-space: nowrap; }
  #linkmeter { order: 5; } #battmeter { order: 6; }
  .meter span { color: var(--muted); font: 500 11px var(--ui); }
  :lang(ar) .meter span { font-family: var(--ar); }
  .bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 13px; }
  .bars i { width: 3.5px; background: var(--line); border-radius: 1px; }
  .bars i:nth-child(1) { height: 4px } .bars i:nth-child(2) { height: 7px } .bars i:nth-child(3) { height: 10px } .bars i:nth-child(4) { height: 13px }
  .bars i.on { background: var(--teal); } .bars.weak i.on { background: var(--amber); } .bars.lost i { background: var(--red); opacity: .55; }
  .batt { width: 26px; height: 13px; border: 1.5px solid var(--muted); border-radius: 3px; padding: 1.5px; position: relative; }
  .batt::after { content: ""; position: absolute; right: -4.5px; top: 3px; width: 2.5px; height: 5px; background: var(--muted); border-radius: 0 1px 1px 0; }
  .batt i { display: block; height: 100%; background: var(--teal); border-radius: 1px; }
  .batt.low i { background: var(--red); }
  :lang(ar) .batt { transform: scaleX(-1); }            /* in Arabic the charge fills from the right */
  .padI { order: 7; display: none; color: var(--teal); } .padI.on { display: inline-flex; } .padI svg { width: 22px; height: 22px; }
  .ibtn { width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--glass-line); background: var(--chip); display: grid; place-items: center; cursor: pointer; padding: 0; }
  #fsbtn { order: 8; } #langbtn { order: 9; } #morebtn { order: 10; }
  .ibtn svg { width: 16px; height: 16px; }
  .lng { font: 700 13px var(--ar); }
  .brk { display: none; }

  /* ---------------------------------------------------------------- read-outs on the map */
  .stats { position: absolute; top: calc(max(8px, var(--st)) + 54px); left: var(--gut); border-radius: 14px; padding: 7px 14px; display: flex; gap: 18px; z-index: 3; }
  .stat > span { display: block; font: 500 10px var(--ui); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; white-space: nowrap; }
  :lang(ar) .stat > span { font: 500 11px var(--ar); letter-spacing: 0; text-transform: none; }
  .stat b { font: 600 20px/1.1 var(--hud); font-variant-numeric: tabular-nums; white-space: nowrap; direction: ltr; unicode-bidi: isolate; display: block; }
  :lang(ar) .stat { text-align: right; }
  .stat b small { font-size: 12px; color: var(--muted); margin-left: 2px; }
  .stat b.warn { color: var(--amber); } .stat b.bad { color: var(--red); }
  .cam { position: absolute; top: calc(max(8px, var(--st)) + 54px); right: var(--gutr); width: 104px; border-radius: 14px; padding: 5px; z-index: 3; cursor: pointer; }
  .cam img { display: block; width: 100%; aspect-ratio: 1; border-radius: 10px; image-rendering: pixelated; background: var(--surface-2); }
  .cam div { font: 500 10px var(--ui); color: var(--muted); text-align: center; padding-top: 3px; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  :lang(ar) .cam div { font: 500 11px var(--ar); text-transform: none; letter-spacing: 0; }

  /* ---------------------------------------------------------------- controls (landscape: floating at the thumbs) */
  .controls { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
  .controls > * { pointer-events: auto; }
  .stickzone { position: absolute; left: var(--gut); bottom: max(10px, var(--sb)); display: grid; justify-items: center; gap: 6px; }
  #stick { width: var(--stick); height: var(--stick); touch-action: none; cursor: grab; display: block; }
  .speed { display: flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px; }
  .speed button { width: 28px; height: 28px; border-radius: 50%; border: 0; background: var(--chip); font: 600 16px var(--ui); cursor: pointer; line-height: 1; padding: 0; }
  .speed b { font: 600 13px var(--hud); min-width: 72px; text-align: center; direction: ltr; }
  .actions { position: absolute; right: var(--gutr); bottom: max(12px, var(--sb)); display: grid; grid-template-columns: auto auto; gap: 10px; align-items: end; justify-items: end; }
  .modes { grid-column: 1 / -1; display: flex; border-radius: 14px; padding: 3px; gap: 2px; }
  .modes button { font: 600 12px var(--hud); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: none; border: 0; padding: 9px 12px; border-radius: 11px; cursor: pointer; white-space: nowrap; }
  :lang(ar) .modes button { font: 600 13px var(--ar); letter-spacing: 0; text-transform: none; }
  .modes button.on { background: var(--amber); color: #141a1f; }
  .side-btns { display: flex; gap: 10px; }
  .round { width: var(--round); height: var(--round); border-radius: 50%; display: grid; place-items: center; align-content: center; gap: 2px; cursor: pointer; font: 600 9.5px var(--ui); text-transform: uppercase; letter-spacing: .05em; padding: 0; }
  :lang(ar) .round { font: 600 11px var(--ar); text-transform: none; letter-spacing: 0; }
  .round svg { width: 20px; height: 20px; }
  .round.on { color: var(--amber); border-color: rgba(245, 165, 36, .7); }
  .stop { width: var(--stop); height: var(--stop); border-radius: 50%; border: 0; cursor: pointer; color: #fff; font: 700 17px var(--hud); letter-spacing: .1em; padding: 0;
    background: radial-gradient(circle at 35% 30%, #ff6b6b, #c81e1e 70%); box-shadow: 0 0 0 4px rgba(239, 68, 68, .25); }
  :lang(ar) .stop { font: 700 19px var(--ar); letter-spacing: 0; }
  .stop.held { background: radial-gradient(circle at 35% 30%, #3fe0c6, #0f9d8a 70%); box-shadow: 0 0 0 4px rgba(45, 212, 191, .25); font-size: 15px; }

  /* ---------------------------------------------------------------- drawer, overlay, toast */
  .drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(320px, 88vw); padding: max(16px, var(--st)) var(--gutr) 16px 18px;
    transform: translateX(105%); transition: transform .25s ease-out; display: flex; flex-direction: column; gap: 12px;
    border-width: 0 0 0 1px; z-index: 6; background: var(--glass-solid); overflow-y: auto; touch-action: pan-y; }
  .drawer.open { transform: none; }
  .drawer[dir="rtl"] { padding: max(16px, var(--st)) 18px 16px var(--gutr); }
  .drawer h3 { font: 700 13px var(--hud); letter-spacing: .1em; text-transform: uppercase; margin: 0; display: flex; justify-content: space-between; align-items: center; }
  .drawer[dir="rtl"] h3 { font: 700 15px var(--ar); letter-spacing: 0; text-transform: none; }
  .drawer dl { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; margin: 0; font-size: 13px; }
  .drawer dt { color: var(--muted); } .drawer dd { margin: 0; font: 600 13px var(--hud); text-align: end; direction: ltr; unicode-bidi: isolate; }
  .drawer dd.txt { font-family: inherit; direction: inherit; }
  .drawer .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: -6px; }
  .drawer[dir="rtl"] .lbl { font-size: 12px; text-transform: none; letter-spacing: 0; }
  .drawer .hint { font-size: 12px; color: var(--muted); margin: 0; }
  .drawer .hint.key { color: var(--text); }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface-2); border-radius: 10px; padding: 3px; flex: none; }
  .seg.two { grid-template-columns: repeat(2, 1fr); }
  .seg button { border: 0; background: none; color: var(--muted); padding: 9px 4px; border-radius: 8px; font-weight: 600; font-size: 12.5px; cursor: pointer; }
  .seg button.on { background: var(--teal); color: #141a1f; }

  .overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(10, 14, 17, .6); z-index: 7; padding: 16px; }
  .overlay .card { width: min(360px, 100%); border-radius: 18px; padding: 18px; display: grid; gap: 10px; border: 1px solid rgba(239, 68, 68, .5); background: var(--glass-solid); }
  .overlay .card.good { border-color: rgba(45, 212, 191, .5); }
  .overlay .card.idle { border-color: var(--glass-line); }
  .overlay h4 { margin: 0; font: 700 18px var(--hud); color: var(--red); letter-spacing: .04em; }
  .overlay .good h4 { color: var(--teal); } .overlay .idle h4 { color: var(--text); }
  .overlay [dir="rtl"] h4 { font-family: var(--ar); letter-spacing: 0; }
  .overlay p { margin: 0; color: var(--muted); font-size: 13.5px; }
  .overlay .row { display: flex; gap: 8px; justify-content: flex-end; }
  .btn { border: 1px solid var(--line); background: var(--surface-2); padding: 10px 16px; border-radius: 10px; font-weight: 600; cursor: pointer; }
  .btn.primary { background: var(--amber); color: #141a1f; border-color: var(--amber); }

  /* small, only for the result of the operator's own taps; inside the map area, clear of the header and the read-outs */
  .toast { position: absolute; left: 50%; top: calc(max(8px, var(--st)) + 58px); transform: translateX(-50%); font-weight: 600; font-size: 12.5px; padding: 6px 12px; border-radius: 10px;
    opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 5; max-width: 300px; text-align: center; }
  .toast.show { opacity: 1; }

  /* ---------------------------------------------------------------- landscape sizes */
  @media (orientation: landscape) and (max-height: 400px) {
    :root { --stick: 150px; --stop: 80px; --round: 52px; }
    .stats { padding: 5px 12px; gap: 14px; } .stat b { font-size: 17px; }
    .cam { width: 84px; }
    .modes button { padding: 8px 10px; }
  }
  @media (orientation: landscape) and (max-width: 900px) { .brand small, #lat { display: none; } }
  @media (orientation: landscape) and (min-width: 1000px) and (min-height: 640px) {
    :root { --stick: 210px; --stop: 104px; --round: 62px; }
    .cam { width: 132px; }
  }

  /* ---------------------------------------------------------------- portrait: header / map / control deck */
  @media (orientation: portrait) {
    :root { --stick: min(250px, max(140px, calc(100vw - 200px)), 30vh); --stop: min(96px, 22vw); --round: min(58px, 14vw); }
    .screen { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
    .topbar { position: relative; top: auto; left: auto; right: auto; margin: max(8px, var(--st)) var(--gut) 0 var(--gutr); flex-wrap: wrap; padding: 6px 6px 6px 12px; }
    .brk { display: block; order: 20; flex: 0 0 100%; height: 0; }
    #linkmeter { order: 21; } #battmeter { order: 22; }
    .spacer2 { display: block; order: 23; flex: 1 1 0; min-width: 0; }
    .achip { order: 24; max-width: 62vw; }
    #fsbtn, #lat, .brand small { display: none; }
    .mapwrap { position: relative; inset: auto; margin: 8px var(--gut) 0 var(--gutr); border-radius: 14px; border: 1px solid var(--line); background: var(--mapbg); }
    .stats { top: 8px; left: 8px; gap: 12px; padding: 6px 10px; } .stat b { font-size: 17px; }
    .cam { top: 8px; right: 8px; width: min(84px, 20vw); }
    .toast { top: auto; bottom: 10px; max-width: calc(100% - 24px); }
    .controls { position: relative; inset: auto; pointer-events: auto; z-index: 3; display: grid; width: 100%; max-width: 560px; margin: 0 auto;
      grid-template-columns: 1fr auto 1fr; grid-template-areas: "modes modes modes" "left stick right";
      align-items: center; justify-items: center; gap: 10px 6px; padding: 10px 12px max(12px, var(--sb)); }
    .stickzone, .actions { position: static; }
    .actions { display: contents; }
    .stickzone { grid-area: stick; }
    .modes { grid-area: modes; width: 100%; justify-content: stretch; }
    .modes button { flex: 1 1 0; padding: 10px 4px; }
    .side-btns { grid-area: left; flex-direction: column; gap: 12px; }
    .stop { grid-area: right; }
  }
  .spacer2 { display: none; }
  @media (orientation: portrait) and (min-width: 600px) {
    :root { --stick: min(260px, 26vh); --stop: 104px; --round: 64px; }
    /* a tablet has room for a one-line header */
    .topbar { flex-wrap: nowrap; }
    .brk, .spacer2 { display: none; }
    .achip { order: 3; }
    #linkmeter { order: 5; } #battmeter { order: 6; }
    .brand small, #lat { display: inline; }
    .controls { padding-top: 14px; gap: 14px 24px; }
    .stats { gap: 18px; padding: 8px 14px; } .stat b { font-size: 20px; }
    .cam { width: 120px; }
    .achip { max-width: 320px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="screen" id="screen">
  <div class="topbar glass" id="topbar">
    <div class="brand">ROVUST <small id="env"></small></div>
    <span class="pill idle" id="status">—</span>
    <span class="achip" id="achip" role="status" aria-live="polite" hidden></span>
    <div class="spacer"></div>
    <div class="meter" id="linkmeter"><span class="bars" id="bars"><i></i><i></i><i></i><i></i></span><b id="link">—</b><span id="lat"></span></div>
    <div class="meter" id="battmeter"><span class="batt" id="battwrap"><i id="batt" style="width:0"></i></span><b id="battpct">—</b></div>
    <span class="padI" id="padI"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11h4M8 9v4M15 12h.01M18 10h.01"/><path d="M17.3 5H6.7a4 4 0 0 0-3.95 3.37l-.9 5.66A3 3 0 0 0 7 16.5l1.5-1.5h7l1.5 1.5a3 3 0 0 0 5.15-2.47l-.9-5.66A4 4 0 0 0 17.3 5z"/></svg></span>
    <button class="ibtn" id="fsbtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
    <button class="ibtn lng" id="langbtn" aria-label="English / عربي">EN</button>
    <button class="ibtn" id="morebtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
    <i class="brk"></i><span class="spacer2"></span>
  </div>

  <div class="mapwrap" id="mapwrap">
    <canvas id="map" aria-label="the rover's map"></canvas>
    <div class="stats glass" id="stats">
      <div class="stat"><span data-i="speed"></span><b><span id="velN">—</span><small>m/s</small></b></div>
      <div class="stat"><span data-i="front"></span><b id="front"><span id="frontN">—</span><small>m</small></b></div>
      <div class="stat"><span data-i="mapped"></span><b><span id="covN">—</span><small>%</small></b></div>
    </div>
    <div class="cam glass" id="camcard"><img id="cam" alt=""><div id="terrain"></div></div>
    <div class="toast glass" id="toast" role="alert"></div>
  </div>

  <div class="controls" id="controls">
    <div class="stickzone">
      <canvas id="stick" width="360" height="360"></canvas>
      <div class="speed glass"><button id="slower" aria-label="slower">−</button><b id="speedval">0.35 m/s</b><button id="faster" aria-label="faster">+</button></div>
    </div>
    <div class="actions">
      <div class="modes glass" id="modes" role="group" aria-label="Who drives">
        <button data-mode="manual" data-i="manual"></button>
        <button data-mode="assisted" data-i="assisted"></button>

    if (hit[1]) $('lights').click();                       // ○ lights
    if (hit[2]) $('home').click();                         // □ return home
    if (hit[4] || hit[5]) {                                // L1 / R1: previous / next mode
      const ms = [...$('modes').children]; let i = ms.findIndex((x) => x.classList.contains('on')); if (i < 0) i = 1;
      ms[(i + (hit[5] ? 1 : ms.length - 1)) % ms.length].click();
    }
    const dz = (v) => (Math.abs(v) < .15 ? 0 : (v - Math.sign(v) * .15) / .85);
    const padX = (b[15] ? 1 : 0) - (b[14] ? 1 : 0), padY = (b[12] ? 1 : 0) - (b[13] ? 1 : 0);
    // ✕ gas / △ reverse, steered by the left stick's X or the d-pad left/right, like a driving game
    let car = null;
    if (b[0] !== b[3]) car = { x: padX || dz(g.axes[0] || 0), y: b[0] ? 1 : -1 };
    // otherwise the left stick and the d-pad both say "go that way" on the map (stick up = map up, diagonals allowed)
    let sx = dz(g.axes[0] || 0), sy = -dz(g.axes[1] || 0);
    if (padX || padY) { const m = Math.hypot(padX, padY); sx = padX / m; sy = padY / m; }
    // R2 / L2 + right stick: analog car driving
    const rt = g.buttons[7] ? g.buttons[7].value : 0, lt = g.buttons[6] ? g.buttons[6].value : 0;
    const dy = (rt > .05 || lt > .05) ? rt - lt : 0, dx = dz(g.axes[2] || 0);
    return { car, held: b[0] || b[3], steer: { x: sx, y: sy }, drive: { x: dx, y: dy } };
  }

  // ---------------------------------------------------------------- one sender for touch, controller and keyboard
  // "steer": (x, y) is where to go on the map (map x = right, map y = up; the map is drawn north-up, so stick up = map up)
  //          and its length is the speed; the rover turns to face it, then drives (circling the stick spins it in place).
  // "drive": tank control, y = forward, x = turn right (keyboard, and the controller's triggers + right stick).
  let lastSend = 0, sentX = 0, sentY = 0, sentType = null;
  function driveTick(now) {
    let x = 0, y = 0, type = null;
    const gp = readPad();
    if (touch.active) { if (touch.x || touch.y) { x = touch.x; y = touch.y; } type = 'steer'; }
    else if (gp && gp.car) { x = gp.car.x; y = gp.car.y; type = 'drive'; }
    else if (gp && !gp.held && (gp.steer.x || gp.steer.y)) { x = gp.steer.x; y = gp.steer.y; type = 'steer'; }
    else if (gp && !gp.held && (gp.drive.x || gp.drive.y)) { x = gp.drive.x; y = gp.drive.y; type = 'drive'; }
    else {
      const ky = (keys.ArrowUp || keys.KeyW ? 1 : 0) - (keys.ArrowDown || keys.KeyS ? 1 : 0);
      const kx = (keys.ArrowRight || keys.KeyD ? .75 : 0) - (keys.ArrowLeft || keys.KeyA ? .75 : 0);
      if (kx || ky) { x = kx; y = ky; type = 'drive'; }
    }
    if (latched) { x = 0; y = 0; type = null; }
    if (x !== shown.x || y !== shown.y) { shown = { x, y }; stickDirty = true; }
    if (touch.active !== shownActive) { shownActive = touch.active; stickDirty = true; }
    if (sentType && type !== sentType) {                       // released, or switched control style: one zero for the old one
      post({ type: sentType, x: 0, y: 0 });
      sentType = null; lastSend = now; sentX = sentY = 0;
    }
    if (type) {
      const changed = Math.abs(x - sentX) > .03 || Math.abs(y - sentY) > .03;
      // at most every 150 ms while the input moves, every 400 ms while held still (the rover's watchdog stops it after 1 s of silence)
      if ((changed && now - lastSend >= 150) || now - lastSend >= 400 || !sentType) {
        lastSend = now; sentX = x; sentY = y; sentType = type;
        post({ type, x, y });
      }
    }
  }

  // ================================================================ buttons
  function toggleStop() {
    latched = !latched;
    $('stop').classList.toggle('held', latched); $('stop').textContent = latched ? tr('resume') : tr('stop');
    if (latched) { release(); post({ type: 'stop' }); buzz([30, 40, 30]); toast(tr('tStopped'), 'var(--red)'); }
    else { buzz(12); toast(tr('tGo'), 'var(--teal)'); }
    render(false);
  }
  $('stop').onclick = toggleStop;
  $('lights').onclick = () => { buzz(10); post({ type: 'lights', on: !(state && state.headlights) }); };
  $('home').onclick = () => { buzz(10); if (latched) toggleStop(); post({ type: 'home' }); };
  $('modes').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    buzz(10);
    for (const x of $('modes').children) x.classList.toggle('on', x === b);
    post({ type: 'mode', mode: b.dataset.mode });
    $('modehint').textContent = tr('hints')[b.dataset.mode] || '';
  });
  $('loss').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    for (const x of $('loss').children) x.classList.toggle('on', x === b);
    post({ type: 'link_loss', action: b.dataset.loss });
  });
  function setTop(v) {
    topSpeed = Math.max(.05, Math.min(.6, Math.round(v * 100) / 100)); speedEditAt = performance.now();
    setText('speedval', topSpeed.toFixed(2) + ' m/s'); buzz(6);
    post({ type: 'speed', value: topSpeed });
  }
  $('slower').onclick = () => setTop(topSpeed - .05);
  $('faster').onclick = () => setTop(topSpeed + .05);
  $('morebtn').onclick = () => $('drawer').classList.toggle('open');
  $('closedrawer').onclick = () => $('drawer').classList.remove('open');
  $('camcard').onclick = () => $('drawer').classList.add('open');
  $('mapview').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setView(b.dataset.v); });
  $('theme').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setTheme(b.dataset.t); });
  $('fsbtn').onclick = async () => {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else { await root.requestFullscreen(); try { await screen.orientation.lock('landscape'); } catch (e) {} }
    } catch (e) { toast(tr('tFs'), 'var(--amber)'); }
  };
  $('restart').onclick = () => post({ type: 'restart' });
  $('langbtn').onclick = () => { LANG = LANG === 'ar' ? 'en' : 'ar'; store.set('rover-lang', LANG); applyLang(); };
  $('achip').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-act]');
    if (b && b.dataset.act === 'lights') { buzz(10); post({ type: 'lights', on: true }); }
  });

  // ================================================================ the alert chip (debounced and held by the simulator; shown quietly, no sound, no popup)
  const IC = {
    warn: '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/>',
    dark: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
    pause: '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>',
  };
  const svg = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;
  const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  let chipKey = '';
  function renderChip(al) {
    const el = $('achip');
    const hide = !al || !state || !state.mission || state.done || al.key === 'ok' || al.sev === 'good';
    if (hide) { if (!el.hidden) { el.hidden = true; chipKey = ''; } return; }
    const f = STR[LANG].a[al.key];
    let txt = String(al.key);
    if (f) { try { txt = f(...(Array.isArray(al.args) ? al.args : [])); } catch (e) { /* keep the key */ } }
    const key = [LANG, al.sev, txt, al.act || '', al.more | 0].join('|');
    if (key === chipKey) return;                     // nothing changed: no DOM work
    chipKey = key;
    el.hidden = false;
    el.dir = LANG === 'ar' ? 'rtl' : 'ltr';
    el.className = 'achip ' + (al.sev || 'info');
    const ic = al.key === 'dark' ? 'dark' : al.key === 'paused' ? 'pause' : 'warn';
    const act = al.act === 'lights' ? `<button data-act="lights">${esc(tr('aDarkBtn'))}</button>` : '';
    const more = al.more > 0 ? `<b class="more">+${al.more | 0}</b>` : '';
    el.innerHTML = `${svg(ic)}<span>${esc(txt)}</span>${act}${more}`;
  }

  // ================================================================ language
  function applyLang() {
    root.lang = LANG;
    const rtl = LANG === 'ar';
    document.querySelectorAll('[data-i]').forEach((el) => { const v = STR[LANG][el.dataset.i]; if (typeof v === 'string') el.textContent = v; });
    for (const id of ['drawer', 'stats', 'toast', 'overcard', 'camcard']) $(id).dir = rtl ? 'rtl' : 'ltr';
    $('langbtn').textContent = rtl ? 'EN' : 'ع';
    $('langbtn').title = rtl ? 'English' : 'عربي';
    $('fsbtn').title = $('fsbtn').ariaLabel = rtl ? 'ملء الشاشة' : 'Full screen';
    $('morebtn').title = $('morebtn').ariaLabel = rtl ? 'التفاصيل والإعدادات' : 'Details and settings';
    $('closedrawer').ariaLabel = rtl ? 'اقفل' : 'Close';
    $('padI').title = rtl ? 'الدراع متوصل' : 'Controller connected';
    $('linkmeter').title = rtl ? 'الإشارة للروبوت' : 'radio link to the rover';
    $('battmeter').title = rtl ? 'البطارية' : 'battery';
    $('stick').ariaLabel = rtl ? 'جويستيك وحواليه قراية السونار' : 'joystick with the sonar ring';
    $('modes').setAttribute('aria-label', rtl ? 'مين اللي سايق' : 'Who drives');
    $('stop').textContent = latched ? tr('resume') : tr('stop');
    memo.clear(); chipKey = '';
    render(false);
    requestAnimationFrame(() => { resize(); });       // text widths changed: re-place the toast
  }

  // ================================================================ state -> screen
  let lastPoseKey = '', lastSonarKey = '';
  function render(fromPoll) { timed('render', () => render_(fromPoll)); }
  function render_(fromPoll) {
    const s = state;
    if (!online) {
      setStatus(tr('stOffline'), 'bad'); setText('env', '');
      showOverlay('bad', tr('stOffline'), tr('offlineP'), false); renderChip(null);
      return;
    }
    if (!s) return;
    if (!s.mission) {
      setStatus(tr('stNoMission'), 'idle'); setText('env', '');
      showOverlay('idle', tr('noMissionT'), tr('noMissionP'), false); renderChip(null);
      return;
    }
    setText('env', (tr('env')[s.env] || s.env) + ' · ' + fmtTime(s.time));
    // link
    const lk = s.link, pct = Math.round(lk.strength * 100), lvl = lk.state === 'lost' ? 0 : Math.max(1, Math.min(4, Math.round(lk.strength * 4)));
    const bars = $('bars'); setClass(bars, 'bars' + (lk.state === 'lost' ? ' lost' : lk.state === 'weak' ? ' weak' : ''));
    const bk = 'b' + lvl; if (memo.get('bars') !== bk) { memo.set('bars', bk); [...bars.children].forEach((b, i) => b.classList.toggle('on', i < lvl)); }
    setText('link', lk.state === 'lost' ? tr('noLink') : pct + '%');
    setText('lat', lk.latency ? tr('delay')(lk.latency.toFixed(1)) : '');
    // battery
    const bf = Math.round(s.battery.fraction * 100);
    if (memo.get('battw') !== bf) { memo.set('battw', bf); $('batt').style.width = bf + '%'; $('battwrap').classList.toggle('low', bf < 20); }
    setText('battpct', bf + '%');
    // status pill
    if (s.done) setStatus(tr('stOver'), 'bad');
    else if (lk.state === 'lost' && s.mode !== 'autonomous') setStatus(s.fallback ? tr('stLost')[s.on_link_loss] : tr('stLostIn')(Math.max(0, Math.ceil(3 - lk.lost_for))), 'bad');
    else if (s.status === 'returning') setStatus(tr('stReturning'), '');
    else if (latched) setStatus(tr('stStopped'), 'idle');
    else if (lk.state === 'weak' && s.mode !== 'autonomous') setStatus(tr('stWeak'), 'warn');
    else setStatus({ manual: tr('stManual'), assisted: tr('stAssisted'), autonomous: tr('stExploring') }[s.effective_mode] || tr('stExploring'), '');
    // read-outs
    setText('velN', Math.abs(s.speed.v).toFixed(2));
    const ahead = s.sonar.filter((x) => Math.abs(x.a) <= 45 && x.ok);
    if (!ahead.length) { setText('frontN', '—'); setClass($('front'), ''); }
    else {
      const front = Math.min(...ahead.map((x) => x.d)), mx = Math.max(...ahead.map((x) => x.max));
      setText('frontN', front >= mx - .01 ? mx.toFixed(1) + '+' : front.toFixed(2));
      setClass($('front'), front < .4 ? 'bad' : front < .9 ? 'warn' : '');
    }
    setText('covN', Math.round(s.coverage * 100));
    const terr = s.terrain && s.terrain !== '?' ? (tr('terrain')[s.terrain] || s.terrain) : '';
    setText('terrain', terr || tr('camera'));
    // drawer (cheap text writes, and only when visible)
    if ($('drawer').classList.contains('open')) {
      setText('beh', tr('beh')[s.behaviour] || String(s.behaviour || '—').toLowerCase());
      setText('mtime', fmtTime(s.time));
      setText('dist', s.distance.toFixed(1) + ' m');
      setText('events', `${s.bumps} / ${s.cliff_events}`);
      setText('hdg', Math.round(((s.pose.theta * 180 / Math.PI) % 360 + 360) % 360) + '°');
      setText('latency', (lk.latency || 0).toFixed(1) + ' s');
      setText('packets', `${lk.delivered} / ${lk.dropped}`);
      setText('terrain2', terr || '—');
      setText('modehint', tr('hints')[s.mode] || '');
    }
    // controls mirror the rover (the desktop can change them too)
    const ck = s.mode + '|' + s.on_link_loss + '|' + s.headlights + '|' + s.status;
    if (memo.get('ctl') !== ck) {
      memo.set('ctl', ck);
      [...$('modes').children].forEach((b) => b.classList.toggle('on', b.dataset.mode === s.mode));
      [...$('loss').children].forEach((b) => b.classList.toggle('on', b.dataset.loss === s.on_link_loss));
      $('lights').classList.toggle('on', !!s.headlights);
      $('home').classList.toggle('on', s.status === 'returning');
    }
    if (performance.now() - speedEditAt > 1500 && s.speed.max) { topSpeed = s.speed.max; setText('speedval', topSpeed.toFixed(2) + ' m/s'); }
    // mission over
    if (s.done) showOverlay((s.status === 'returned' || s.status === 'stopped') ? 'good' : 'bad', tr('overT'), s.end_reason || '', true);
    else if (!$('over').hidden) $('over').hidden = true;
    renderChip(s.alert);
    // redraw only what the new state changes
    const pk = s.pose.x + ',' + s.pose.y + ',' + s.pose.theta + ',' + s.headlights;
    if (pk !== lastPoseKey) { lastPoseKey = pk; mapDirty = true; }
    const sk = s.sonar.map((x) => x.d.toFixed(2) + x.ok).join() + s.cliff.join();
    if (sk !== lastSonarKey) { lastSonarKey = sk; stickDirty = true; }
  }
  function setStatus(txt, cls) { setText('status', txt); setClass($('status'), 'pill' + (cls ? ' ' + cls : '')); }
  function showOverlay(kind, title, text, restart) {
    if ($('over').hidden) $('over').hidden = false;
    setClass($('overcard'), 'card ' + kind);
    setText('overT', title); setText('overP', text); $('overRow').hidden = !restart;
  }

  // ================================================================ polling: state about 4 Hz, the map picture at most once a second, nothing while hidden
  let polling = false, fails = 0, nextPoll = 0, lastMapAt = 0, imgBusy = false;
  async function poll() {
    polling = true;
    try {
      const s = await (await fetch('/api/state', { cache: 'no-store' })).json();
      const wasDone = state && state.done;
      state = s; online = true; fails = 0;
      if (s.mission && wasDone && !s.done && latched) toggleStop();    // a new mission starts unlatched
      render(true);
      if (s.mission && performance.now() - lastMapAt >= 1000) refreshImages();
    } catch (e) {
      if (++fails >= 3 && online) { online = false; render(false); }
    } finally { polling = false; nextPoll = performance.now() + (online ? 250 : 1500); }
  }
  function refreshImages() {
    if (imgBusy) return;
    imgBusy = true; lastMapAt = performance.now();
    const t = Date.now(), im = new Image();
    im.onload = () => {
      if (off.width !== im.naturalWidth || off.height !== im.naturalHeight) { off.width = im.naturalWidth; off.height = im.naturalHeight; }
      octx.drawImage(im, 0, 0); haveMap = true; imgBusy = false; mapDirty = true;
    };
    im.onerror = () => { imgBusy = false; };
    im.src = '/api/map.png?' + t;
    $('cam').src = '/api/camera.png?' + t;
  }

  // ================================================================ loops
  let lastPaint = 0, rafPending = false;
  function paint() {
    lastPaint = performance.now();
    if (mapDirty) { mapDirty = false; timed('map', drawMap); }
    if (stickDirty) { stickDirty = false; timed('stick', drawStick); }
  }
  const schedule = () => { if (!rafPending) { rafPending = true; requestAnimationFrame(() => { rafPending = false; paint(); }); } };
  setInterval(() => {
    if (document.hidden) return;                     // a hidden page does nothing at all
    const now = performance.now();
    driveTick(now);
    if (!polling && now >= nextPoll) poll();
    if (mapDirty || stickDirty) { schedule(); if (rafPending && now - lastPaint > 250) paint(); }   // frames throttled: still keep the picture current
  }, 40);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { release(); for (const k in keys) keys[k] = false; if (sentType) { post({ type: sentType, x: 0, y: 0 }); sentType = null; } }
    else { nextPoll = 0; lastMapAt = 0; }
  });
  addEventListener('resize', () => requestAnimationFrame(resize));
  if (window.ResizeObserver) new ResizeObserver(() => resize()).observe($('mapwrap'));

  readColors();
  for (const b of $('theme').children) b.classList.toggle('on', b.dataset.t === (root.dataset.theme || 'dark'));
  setView(view);
  applyLang();
  resize();
})();
</script>
</body>
</html>

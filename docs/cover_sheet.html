<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Rovust — أعضاء الفريق</title>
<style>
  @font-face { font-family: "Plex Arabic"; src: url("../assets/fonts/IBMPlexSansArabic-Regular.ttf"); font-weight: 400; }
  @font-face { font-family: "Plex Arabic"; src: url("../assets/fonts/IBMPlexSansArabic-SemiBold.ttf"); font-weight: 600; }
  @font-face { font-family: "Plex Arabic"; src: url("../assets/fonts/IBMPlexSansArabic-Bold.ttf"); font-weight: 700; }
  @font-face { font-family: "Inter"; src: url("../assets/fonts/Inter[opsz,wght].ttf"); }
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 210mm; height: 297mm; }
  body { font-family: "Plex Arabic", "Segoe UI", Tahoma, sans-serif; color: #14191e; background: #fff; }
  .page { height: 297mm; display: flex; flex-direction: column; }
  .band { background: #11161b; color: #e6edf3; padding: 17mm 20mm; position: relative; display: flex; align-items: center; justify-content: center; gap: 8mm; }
  .band::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2.2mm; background: linear-gradient(90deg, #f5a524, #2dd4bf); }
  .band img { width: 34mm; height: 34mm; }
  .name { font-family: "Inter", sans-serif; font-weight: 800; font-size: 50pt; letter-spacing: -1pt; line-height: 1; direction: ltr; }
  .body { flex: 1; padding: 16mm 22mm 20mm; display: flex; flex-direction: column; }
  h2 { font-size: 20pt; font-weight: 700; margin-bottom: 7mm; display: flex; align-items: center; gap: 3.5mm; }
  h2::before { content: ""; width: 2.4mm; height: 9mm; background: #2dd4bf; border-radius: 1.2mm; }
  table { width: 100%; flex: 1; border-collapse: collapse; font-size: 19pt; }
  th { text-align: right; font-weight: 600; font-size: 12pt; color: #5f6b76; padding: 0 5mm 3mm; border-bottom: 0.7mm solid #14191e; height: 1mm; }
  td { padding: 0 5mm; border-bottom: 0.3mm solid #dfe4e8; }
  tr:nth-child(even) td { background: #f5f8f9; }
  td.n { width: 16mm; text-align: center; font-family: "Inter", sans-serif; font-weight: 700; color: #0f9e8d; }
</style>
</head>
<body>
<div class="page">
  <div class="band">
    <img src="../assets/icon@2x.png" alt="">
    <div class="name">Rovust</div>
  </div>
  <div class="body">
    <h2>أعضاء الفريق</h2>
    <table>
      <tr><th>#</th><th>الاسم</th></tr>
      <tr><td class="n">1</td><td>أحمد حامد محمد</td></tr>
      <tr><td class="n">2</td><td>أمل هشام حسني</td></tr>
      <tr><td class="n">3</td><td>تسنيم أمين جميل</td></tr>
      <tr><td class="n">4</td><td>خلود وليد عطية</td></tr>
      <tr><td class="n">5</td><td>دنيا عصام فتحي</td></tr>
      <tr><td class="n">6</td><td>مازن محمد حسين</td></tr>
      <tr><td class="n">7</td><td>محمد أسامة صلاح</td></tr>
      <tr><td class="n">8</td><td>محمد السيد محمد</td></tr>
      <tr><td class="n">9</td><td>محمود أحمد عبد الغني</td></tr>
    </table>
  </div>
</div>
</body>
</html>

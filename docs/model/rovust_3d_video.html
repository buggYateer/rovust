<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rovust 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Arabic:wght@500;700&display=swap">
<style>
:root{--bg:#0e161b;--ink:#eef4f6;--muted:#9fb1ba;--accent:#3cc9b5;--warn:#e5a84a;
  --ar:"IBM Plex Sans Arabic",Tahoma,sans-serif;--mono:"IBM Plex Mono",Consolas,monospace}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.cap{position:fixed;left:50%;bottom:6.5vh;transform:translateX(-50%);width:min(86vw,1400px);
  display:grid;justify-items:center;gap:.6vh;text-align:center;pointer-events:none}
.cap .ar{font-family:var(--ar);font-weight:700;direction:rtl;font-size:clamp(18px,2.6vw,52px);line-height:1.35;
  text-shadow:0 2px 12px rgba(0,0,0,.75)}
.cap .en{font-family:var(--mono);direction:ltr;font-size:clamp(12px,1.35vw,27px);color:var(--accent);letter-spacing:.02em;
  text-shadow:0 2px 10px rgba(0,0,0,.8)}
.cap .why{font-family:var(--ar);font-weight:500;direction:rtl;font-size:clamp(13px,1.6vw,32px);color:#d6e3e9;line-height:1.4;text-shadow:0 2px 10px rgba(0,0,0,.85)}
.cap .note{font-family:var(--ar);direction:rtl;font-size:clamp(11px,1.15vw,22px);color:var(--warn);text-shadow:0 2px 8px rgba(0,0,0,.8)}
.brand{position:fixed;top:4vh;right:3vw;font-family:var(--mono);font-size:clamp(12px,1.4vw,28px);letter-spacing:.3em;color:var(--muted)}
.chap{position:fixed;top:4vh;left:3vw;font-family:var(--ar);direction:rtl;font-size:clamp(12px,1.4vw,28px);color:var(--muted)}
.water{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at 50% 30%,rgba(40,140,200,.22),rgba(10,60,110,.42))}
.title{position:fixed;inset:0;display:grid;place-content:start center;padding-top:14vh;justify-items:center;gap:1.5vh;pointer-events:none}
.title b{font-family:var(--mono);font-size:clamp(36px,7vw,140px);letter-spacing:.12em;color:var(--accent)}
.title span{font-family:var(--mono);direction:ltr;font-size:clamp(14px,1.9vw,38px);letter-spacing:.08em;color:var(--ink)}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;align-items:center;padding:8px 14px;background:rgba(0,0,0,.45)}
.bar button{font:600 14px var(--ar);background:var(--accent);color:#06201c;border:0;border-radius:6px;padding:4px 14px;cursor:pointer}
.bar input{flex:1;accent-color:var(--accent)}
.bar span{font:13px var(--mono);color:var(--muted);min-width:90px;text-align:center}
body.rec .bar{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="brand">ROVUST</div>
<div class="chap" id="chap"></div>
<div class="title" id="title"><b>ROVUST</b><span>The rover, inside and outside</span></div>
<div class="water" id="water"></div>
<div class="cap" id="cap"><div class="ar" id="capAr"></div><div class="why" id="capWhy"></div><div class="en" id="capEn"></div><div class="note" id="capNote"></div></div>
<div class="bar"><button id="play">إيقاف</button><input type="range" id="seek" min="0" max="76" step="0.01" value="0" aria-label="الوقت"><span id="time"></span></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
// ------------------------------------------------------------------ data (cm)
// same numbers as the dimensions page. robot frame: x forward, y left, z up.
// three.js: X = x, Y = z, Z = -y  (so the robot's right side is +Z)
const R = {wheelR:5, wheelW:4, track:30, wheelbase:20, bodyR:20, deckZ:11, deckT:1.4,
  sonarZ:16.5, irX:14, irZ:13.4, irY:[0,15,-15], camX:14, camZ:26, camLook:80, antX:-13, antTop:36, cliffZ:9,
  cliff:[[32,12],[32,-12],[0,26],[0,-26],[-32,12],[-32,-12]]};
const V = (x, y, z) => new THREE.Vector3(x, z, -y);   // robot (x,y,z) -> three

// ------------------------------------------------------------------ timeline
const BEATS = [
  {k:"title", d:6, chap:"", ar:"", en:"", note:""},
  {k:"overview", d:6, chap:"الشكل العام", ar:"روبوت مستكشف: جسم دائري قطره 40 سم على أربع عجل", en:"Ø 40 cm body · 4 wheels · 8 sonars · 20+ sensors", note:"المحاكاة من فوق بس، فالارتفاعات هنا تقديرية"},
  {k:"wheels", d:8, chap:"الحركة", ar:"أربع عجل وموتورين: كل موتور بيلف العجلتين اللي في جنبه", en:"2 DC motors · one per side · skid-steer", note:""},
  {k:"spin", d:6, chap:"الحركة", ar:"يلف في مكانه: جنب لقدّام وجنب لورا بنفس السرعة", en:"left = −right", note:""},
  {k:"xray", d:8, chap:"جوه الشاسيه", ar:"جوه: موتور لكل جنب، وعلبة تروس، وعدّاد لفّات، والبطارية", en:"DC motor 12 V · gearbox 30:1 · encoder 480 / turn · battery 18 Wh", note:"أماكن القطع جوه تقديرية"},
  {k:"sonar", d:9, chap:"أماكن السنسورز", ar:"تمانية سونار على حرف الجسم، واحد كل 45 درجة", why:"ليه كده؟ مفيش حتة من الجسم بتداري على أي مخروط، فبيشوف حواليه كله", en:"Sonar ×8 · 2.5 m · 15° cone", note:""},
  {k:"ir", d:9, chap:"أماكن السنسورز", ar:"تلات حساسات مسافة باصّين لقدّام، بتقيس من 6 لـ 80 سم", why:"ليه كده؟ متوزعين على عرض الجسم كله، وراجعين 6 سم لجوه لأن أقرب من كده القراية بتغلط", en:"IR distance ×3", note:""},
  {k:"cliff", d:10, chap:"أماكن السنسورز", ar:"ستة حساسات حفر بتبص على الأرض: قدّام وورا وعلى الجنب", why:"ليه ورا؟ لأن الروبوت بيرجع لورا وهو بيهرب. وليه على الجنب؟ لأن جسمه بيقرّب من الحفر وهو بيلف", en:"Cliff sensors ×6", note:""},
  {k:"bumper", d:5, chap:"أماكن السنسورز", ar:"شريطين قدّام بيقفلوا لو الروبوت خبط", why:"آخر خط دفاع، وبيقول الخبطة جت من أنهي ناحية", en:"Bumpers L / R", note:""},
  {k:"camera", d:7, chap:"أماكن السنسورز", ar:"الكاميرا مايلة لتحت وبتشوف الأرض على بعد 80 سم", why:"بتصوّر الأرض اللي الروبوت داخل عليها، والصورة بتروح لمصنّف الأرض", en:"Camera → AI terrain classifier", note:"ارتفاعها وميلها تقدير"},
  {k:"imu", d:6, chap:"أماكن السنسورز", ar:"في النص: حساسات الاتجاه. وورا: هوائي الراديو", why:"حساسات الاتجاه عند مركز الجسم، والبوصلة فوق بعيد عن الموتورات", en:"Gyro · Compass · Accel · Radio", note:""},
  {k:"drive", d:6, chap:"بيتحرك", ar:"الجنبين نفس السرعة: مستقيم. جنب أسرع: يلف", en:"v , ω  →  left , right", note:""},
  {k:"w1", d:5, chap:"تحت المية", ar:"تحت المية بيتحوّل: العجل بيتشال وبيبقى مروحتين", why:"نفس الكود بالظبط: المروحتين نفس السرعة يمشي مستقيم، وواحدة أسرع يلف", en:"Wheels → 2 thrusters · same drive code", note:""},
  {k:"w2", d:6, chap:"تحت المية", ar:"حساسات المسافة والحفر بتتشال، والسونار بيبقى 12 بدل 8", why:"النور مش بيمشي في المية، ومفيش حفرة لأنه عايم. والصوت بيمشي كويس، فالسونار بيزيد", en:"IR, cliff → removed · sonar ×8 → ×12", note:""},
  {k:"w3", d:6, chap:"تحت المية", ar:"وبدل عدّاد العجل: حساس سرعة من القاع، وحساس ضغط للعمق", why:"والراديو بيبقى مودم صوتي، والإلكترونيات كلها في صندوق مقفول", en:"Encoders → DVL · pressure · acoustic modem · sealed hull", note:"أماكنهم تقديرية"},
  {k:"end", d:2, chap:"", ar:"", en:"", note:""}
];
{ let s = 0; for (const b of BEATS) { b.t = s; s += b.d; } }
const BK = Object.fromEntries(BEATS.map(b => [b.k, b]));
const TOTAL = BEATS.reduce((s, b) => s + b.d, 0);
const beatAt = t => { let i = 0; while (i < BEATS.length - 1 && t >= BEATS[i + 1].t) i++; return i; };

// motion segments: [t0, t1, v cm/s, w rad/s]
const DV = BK.drive.t;
const SEG = [[13,15.5,14,0],[15.5,16,0,0],[16,18.5,-14,0],[21,26,0,2*Math.PI/5],[DV+1,DV+3.5,22,0],[DV+3.5,DV+6,22,0.65]];
const segAt = t => { for (const s of SEG) if (t >= s[0] && t < s[1]) return s; return null; };
// integrate pose + wheel angles once, at 200 Hz (deterministic)
const HZ = 200, N = Math.ceil(TOTAL * HZ) + 2, P = new Float32Array(N * 5);
{ let x = 0, y = 0, h = 0, al = 0, ar = 0;
  for (let i = 0; i < N; i++) {
    P.set([x, y, h, al, ar], i * 5);
    const s = segAt(i / HZ), v = s ? s[2] : 0, w = s ? s[3] : 0, dt = 1 / HZ;
    const wl = (v - w * R.track / 2) / R.wheelR, wr = (v + w * R.track / 2) / R.wheelR;
    al += wl * dt; ar += wr * dt;
    x += v * Math.cos(h) * dt; y += v * Math.sin(h) * dt; h += w * dt;
  } }
const pose = t => { const i = Math.min(N - 1, Math.max(0, Math.round(t * HZ))) * 5; return {x:P[i], y:P[i+1], h:P[i+2], al:P[i+3], ar:P[i+4]}; };

// ------------------------------------------------------------------ scene
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e161b);
scene.fog = new THREE.Fog(0x0e161b, 260, 520);
const cam = new THREE.PerspectiveCamera(38, 16 / 9, 1, 2000);
scene.add(new THREE.HemisphereLight(0xdfeff5, 0x1a2328, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 0.75); sun.position.set(80, 160, 60); scene.add(sun);
const fill = new THREE.DirectionalLight(0x9fd8ff, 0.3); fill.position.set(-100, 60, -80); scene.add(fill);

// ground with a 10 cm grid
{ const g = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200), new THREE.MeshStandardMaterial({color:0x2a3a44, roughness:1}));
  g.rotation.x = -Math.PI / 2; scene.add(g);
  const grid = new THREE.GridHelper(600, 60, 0x3d5260, 0x34474f); grid.position.y = 0.05; scene.add(grid); }

const C = {body:0x8b99a2, body2:0x56656e, tire:0x1b2227, hub:0x9aaab3, sonar:0x3cc9b5, ir:0xf08a6e, cliff:0xe5a84a, dark:0x2a3238, accent:0x3cc9b5};
const mat = (color, o = {}) => new THREE.MeshStandardMaterial({color, roughness:.55, metalness:.08, transparent:true, opacity:1, ...o});
const robot = new THREE.Group(); scene.add(robot);
const parts = {};                                       // key -> list of meshes (for highlight)
const add = (key, mesh, parent = robot) => { (parts[key] = parts[key] || []).push(mesh); mesh.userData.key = key; parent.add(mesh); return mesh; };

// contact shadow
{ const cv = document.createElement("canvas"); cv.width = cv.height = 128; const x = cv.getContext("2d");
  const gr = x.createRadialGradient(64, 64, 10, 64, 64, 64); gr.addColorStop(0, "rgba(0,0,0,.55)"); gr.addColorStop(1, "rgba(0,0,0,0)");
  x.fillStyle = gr; x.fillRect(0, 0, 128, 128);
  const s = new THREE.Mesh(new THREE.PlaneGeometry(56, 56), new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv), transparent:true, depthWrite:false}));
  s.rotation.x = -Math.PI / 2; s.position.y = .1; robot.add(s); }

// wheels: each side's two wheels share one angle
const wheels = {L:[], R:[]};
for (const sx of [1, -1]) for (const [side, sy] of [["L", 1], ["R", -1]]) {
  const g = new THREE.Group(); g.position.copy(V(sx * R.wheelbase / 2, sy * R.track / 2, R.wheelR));
  const tire = new THREE.Mesh(new THREE.CylinderGeometry(R.wheelR, R.wheelR, R.wheelW, 40), mat(C.tire, {roughness:.9}));
  tire.rotation.x = Math.PI / 2; g.add(tire); (parts.wheels = parts.wheels || []).push(tire);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.2, R.wheelW + .3, 24), mat(C.hub)); hub.rotation.x = Math.PI / 2; g.add(hub);
  for (let k = 0; k < 10; k++) {                            // tread blocks so the turning shows
    const a = k / 10 * Math.PI * 2, b = new THREE.Mesh(new THREE.BoxGeometry(1.6, .8, R.wheelW + .2), mat(0x323c43));
    b.position.set(Math.cos(a) * (R.wheelR + .1), Math.sin(a) * (R.wheelR + .1), 0); b.rotation.z = a + Math.PI / 2; g.add(b);
  }
  const spoke = new THREE.Mesh(new THREE.BoxGeometry(4.2, .9, R.wheelW + .5), mat(C.cliff)); g.add(spoke);
  g.traverse(n => n.userData.key = "wheels"); robot.add(g); wheels[side].push(g);
}
// chassis, deck, top box
const shell = [];
shell.push(add("chassis", new THREE.Mesh(new THREE.BoxGeometry(28, 7, 22), mat(C.body2))));
parts.chassis[0].position.copy(V(0, 0, 7.5));
shell.push(add("deck", new THREE.Mesh(new THREE.CylinderGeometry(R.bodyR, R.bodyR, R.deckT, 64), mat(C.body))));
parts.deck[0].position.copy(V(0, 0, R.deckZ + R.deckT / 2));
shell.push(add("deck", new THREE.Mesh(new THREE.BoxGeometry(20, 5.5, 16), mat(0x6c7a83, {roughness:.8}))));
parts.deck[1].position.copy(V(0, 0, R.deckZ + R.deckT + 2.75));
// sonar ring + 8 transducers
const sonarRing = add("sonar", new THREE.Mesh(new THREE.CylinderGeometry(R.bodyR + .2, R.bodyR + .2, 2.2, 64, 1, true), mat(0x56707d, {side:THREE.DoubleSide})));
sonarRing.position.copy(V(0, 0, R.sonarZ)); shell.push(sonarRing);
const posts = [];
for (let i = 0; i < 8; i++) {
  const a = i * Math.PI / 4;
  const s = add("sonar", new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 1.6, 24), mat(C.sonar, {emissive:0x0b3b35})));
  s.position.copy(V((R.bodyR + .9) * Math.cos(a), (R.bodyR + .9) * Math.sin(a), R.sonarZ));
  s.rotation.order = "YXZ"; s.rotation.y = a; s.rotation.z = Math.PI / 2;
  const p = new THREE.Mesh(new THREE.CylinderGeometry(.5, .5, R.sonarZ - R.deckZ - R.deckT - 1, 8), mat(0x56707d));
  p.position.copy(V(R.bodyR * .97 * Math.cos(a + .39), R.bodyR * .97 * Math.sin(a + .39), (R.sonarZ + R.deckZ + R.deckT) / 2 - .5)); p.userData.key = "sonar"; robot.add(p); posts.push(p);
}
// IR x3 on the front of the deck
for (const y of R.irY) {
  const b = add("ir", new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.6, 3.6), mat(C.ir, {emissive:0x3a1408})));
  b.position.copy(V(R.irX, y, R.irZ));
}
// cliff sensors under the deck rim
const cliffMount = [[17, 10], [17, -10], [0, 19.5], [0, -19.5], [-17, 10], [-17, -10]];
for (const [x, y] of cliffMount) { const b = add("cliff", new THREE.Mesh(new THREE.BoxGeometry(2, 1.6, 2), mat(C.cliff, {emissive:0x3a2504}))); b.position.copy(V(x, y, R.cliffZ)); }
// bumpers: two arcs on the front of the deck
for (const s of [1, -1]) {
  const th0 = s > 0 ? 4 : -52, len = 48;
  const geo = new THREE.CylinderGeometry(R.bodyR + 1.2, R.bodyR + 1.2, 2.2, 32, 1, true, 0, len * Math.PI / 180);
  const m = add("bumper", new THREE.Mesh(geo, mat(0x39444b, {side:THREE.DoubleSide})));
  // CylinderGeometry theta starts on +Z and goes toward +X; robot angle a maps to three angle (a + 90°)
  m.rotation.y = (th0 + 90) * Math.PI / 180 - Math.PI / 2 + Math.PI / 2;
  m.position.y = 8.6;
}
// camera on a mast
const tilt = Math.atan2(R.camZ, R.camLook - R.camX);
{ const mast = add("camera", new THREE.Mesh(new THREE.CylinderGeometry(.6, .6, R.camZ - R.deckZ - R.deckT, 12), mat(C.dark)));
  mast.position.copy(V(R.camX - 2, 0, (R.camZ + R.deckZ + R.deckT) / 2));
  const cg = new THREE.Group(); cg.position.copy(V(R.camX, 0, R.camZ)); cg.rotation.z = -tilt; robot.add(cg);
  const body = new THREE.Mesh(new THREE.BoxGeometry(5, 3.2, 4), mat(C.dark)); cg.add(body); parts.camera.push(body);
  const lens = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.1, 1.2, 20), mat(C.sonar, {emissive:0x0e4a42})); lens.rotation.z = Math.PI / 2; lens.position.x = 3; cg.add(lens); parts.camera.push(lens); cg.traverse(n => n.userData.key = "camera"); }
// IMU + antenna
const imu = add("imu", new THREE.Mesh(new THREE.BoxGeometry(3, 1.4, 3), mat(0xe9eef0)));
imu.position.copy(V(0, 0, R.deckZ + R.deckT + 5.5 + .7));
{ const a = add("antenna", new THREE.Mesh(new THREE.CylinderGeometry(.45, .45, R.antTop - R.deckZ - R.deckT, 10), mat(C.dark)));
  a.position.copy(V(R.antX, 0, (R.antTop + R.deckZ + R.deckT) / 2));
  const k = add("antenna", new THREE.Mesh(new THREE.SphereGeometry(1, 16, 12), mat(C.dark))); k.position.copy(V(R.antX, 0, R.antTop)); }

// underwater: two thrusters, one per side (they replace the wheels in that world)
const props = [];
for (const sy of [1, -1]) {
  const g = new THREE.Group(); g.position.copy(V(-3, sy * 24, 7)); robot.add(g);
  const duct = new THREE.Mesh(new THREE.CylinderGeometry(3.6, 3.6, 6, 32, 1, true), mat(0x3a4a54, {side:THREE.DoubleSide})); duct.rotation.z = Math.PI / 2; g.add(duct);
  const hub = new THREE.Mesh(new THREE.CylinderGeometry(.9, .9, 4.4, 16), mat(0x9aaab3)); hub.rotation.z = Math.PI / 2; g.add(hub);
  const arm = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.4, 4.2), mat(0x3a4a54)); const arm2 = arm; arm.scale.z = 2.2; arm.position.set(0, 0, sy > 0 ? 6 : -6); g.add(arm);
  const prop = new THREE.Group(); g.add(prop); props.push(prop);
  for (let k = 0; k < 3; k++) { const bl = new THREE.Mesh(new THREE.BoxGeometry(.5, 3.1, 1.3), mat(C.sonar, {emissive:0x0b3b35})); bl.position.y = 1.6; const h = new THREE.Group(); h.rotation.x = k * 2 * Math.PI / 3; bl.rotation.x = .5; h.add(bl); prop.add(h); }
  g.traverse(n => n.userData.key = "thruster");
}
const thrusterGroups = []; robot.traverse(n => { if (n.isGroup && n.userData.key === "thruster" && n.parent === robot) thrusterGroups.push(n); });
const sonarHeads = parts.sonar.filter(m => m.geometry.parameters && m.geometry.parameters.radiusTop === 1.5);
for (let i = 0; i < 12; i++) {                       // the underwater ring: 12 sonars, 30 degrees apart
  const a = i * Math.PI / 6;
  const s = add("sonar12", new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 1.6, 24), mat(C.sonar, {emissive:0x0b3b35})));
  s.position.copy(V((R.bodyR + .9) * Math.cos(a), (R.bodyR + .9) * Math.sin(a), R.sonarZ)); s.rotation.order = "YXZ"; s.rotation.y = a; s.rotation.z = Math.PI / 2;
}
const dvl = add("dvl", new THREE.Mesh(new THREE.CylinderGeometry(3, 3.6, 2.2, 24), mat(0xe5a84a, {emissive:0x2a1a02}))); dvl.position.copy(V(4, 0, 2.6));
const pressure = add("pressure", new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 3, 16), mat(0xf08a6e, {emissive:0x3a1408}))); pressure.position.copy(V(-6, 9, R.deckZ + R.deckT + 1.5));
const modem = add("modem", new THREE.Mesh(new THREE.CylinderGeometry(2.6, 2.6, 2.4, 24), mat(0x3cc9b5, {emissive:0x0b3b35}))); modem.position.copy(V(R.antX, 0, R.deckZ + R.deckT + 1.2));
const hull = add("hull", new THREE.Mesh(new THREE.SphereGeometry(1, 40, 24), mat(0x8fd6ff, {roughness:.15, metalness:.1, opacity:.3})));
hull.position.copy(V(0, 0, 7.5)); hull.userData.base = new THREE.Vector3(17, 6.5, 14);
// inside: motors, gearboxes, encoders, battery, shafts to both wheels of a side
const inside = new THREE.Group(); robot.add(inside);
for (const [side, sy] of [["L", 1], ["R", -1]]) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(2.1, 2.1, 9, 24), mat(0xb0b8bd, {metalness:.5})); m.rotation.z = Math.PI / 2; m.position.copy(V(-1, sy * 6.5, 7.5)); inside.add(m); (parts.motors = parts.motors || []).push(m);
  const gb = new THREE.Mesh(new THREE.BoxGeometry(4, 5, 5), mat(0x6c7a83)); gb.position.copy(V(5.5, sy * 6.5, 7.5)); inside.add(gb); parts.motors.push(gb);
  const en = new THREE.Mesh(new THREE.CylinderGeometry(2.4, 2.4, .8, 24), mat(C.sonar, {emissive:0x0e4a42})); en.rotation.z = Math.PI / 2; en.position.copy(V(-6, sy * 6.5, 7.5)); inside.add(en); (parts.encoders = parts.encoders || []).push(en);
  for (const sx of [1, -1]) {                               // a drive belt to each wheel of this side
    const belt = new THREE.Mesh(new THREE.BoxGeometry(Math.abs(sx * 10 - (sx > 0 ? 5.5 : -1)) + 2, .9, .9), mat(C.cliff));
    belt.position.copy(V((sx * 10 + (sx > 0 ? 5.5 : -1)) / 2, sy * 12.5, 6)); inside.add(belt); parts.motors.push(belt);
  }
  const ax = new THREE.Mesh(new THREE.CylinderGeometry(.6, .6, 7, 10), mat(0x8a959b)); ax.rotation.x = Math.PI / 2; ax.position.copy(V(5.5, sy * 10, 6)); inside.add(ax);
}
const bat = new THREE.Mesh(new THREE.BoxGeometry(7, 4, 12), mat(C.cliff, {emissive:0x2a1a02})); bat.position.copy(V(-9.5, 0, 7.5)); inside.add(bat); parts.battery = [bat];
const ctrl = new THREE.Mesh(new THREE.BoxGeometry(8, 1, 9), mat(0x2f6b4f)); ctrl.position.copy(V(-1, 0, 10.2)); inside.add(ctrl);
const flow = new THREE.Mesh(new THREE.BoxGeometry(3, 1, 3), mat(C.sonar)); flow.position.copy(V(0, 0, 3.5)); inside.add(flow);
bat.userData.key = "battery"; ctrl.userData.key = "ctrl"; flow.userData.key = "flow";
for (const m of parts.encoders) m.userData.key = "encoders";
inside.traverse(n => { n.userData.inside = true; if (n.isMesh && !n.userData.key) n.userData.key = "motors"; });

// ------------------------------------------------------------------ effects

const fx = {};
const efx = k => { const g = new THREE.Group(); robot.add(g); fx[k] = g; return g; };
const glow = (color, o) => new THREE.MeshBasicMaterial({color, transparent:true, opacity:o, depthWrite:false, side:THREE.DoubleSide});
{ // sonar cones + echoes
  const g = efx("sonar"); g.userData.echo = [];
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4, L = 60, rr = Math.tan(7.5 * Math.PI / 180) * L;
    const cone = new THREE.Mesh(new THREE.ConeGeometry(rr, L, 32, 1, true), glow(C.sonar, .16));
    const holder = new THREE.Group(); holder.position.copy(V(R.bodyR + 1.5, 0, R.sonarZ).applyAxisAngle(new THREE.Vector3(0, 1, 0), a));
    holder.rotation.y = a; g.add(holder);
    cone.rotation.z = Math.PI / 2; cone.position.x = L / 2; holder.add(cone);
    const echo = new THREE.Mesh(new THREE.TorusGeometry(1, .18, 6, 32), glow(C.sonar, .8)); echo.rotation.y = Math.PI / 2; holder.add(echo); g.userData.echo.push(echo);
  }
}
{ const g = efx("ir");
  for (const y of R.irY) { const L = 80, b = new THREE.Mesh(new THREE.CylinderGeometry(.35, .35, L, 8), glow(C.ir, .85)); b.rotation.z = Math.PI / 2; b.position.copy(V(R.irX + 1 + L / 2, y, R.irZ)); g.add(b); }
}
{ const g = efx("cliff");
  cliffMount.forEach(([x, y], i) => {
    const a = V(x, y, R.cliffZ), b = V(R.cliff[i][0], R.cliff[i][1], 0.2), d = b.clone().sub(a);
    const ray = new THREE.Mesh(new THREE.CylinderGeometry(.3, .3, d.length(), 8), glow(C.cliff, .85));
    ray.position.copy(a.clone().add(b).multiplyScalar(.5)); ray.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.clone().normalize()); g.add(ray);
    const ring = new THREE.Mesh(new THREE.RingGeometry(2, 2.8, 32), glow(C.cliff, .9)); ring.rotation.x = -Math.PI / 2; ring.position.copy(b); g.add(ring);
  });
}
{ const g = efx("camera");
  const cv = document.createElement("canvas"); cv.width = cv.height = 16; const x = cv.getContext("2d");
  for (let i = 0; i < 16; i++) for (let j = 0; j < 16; j++) { const v = 90 + ((i * 7 + j * 13) % 9) * 12 + (Math.sin(i * .9 + j * .4) > .3 ? 40 : 0); x.fillStyle = `rgb(${v},${v - 6},${v - 18})`; x.fillRect(i, j, 1, 1); }
  const tex = new THREE.CanvasTexture(cv); tex.magFilter = THREE.NearestFilter;
  const patch = new THREE.Mesh(new THREE.PlaneGeometry(14, 10), new THREE.MeshBasicMaterial({map:tex, transparent:true, opacity:1}));
  patch.rotation.x = -Math.PI / 2; patch.position.copy(V(R.camLook, 0, .3)); g.add(patch);
  const o = V(R.camX + 3, 0, R.camZ), corners = [[-7, -5], [7, -5], [7, 5], [-7, 5]].map(([a, b]) => V(R.camLook + a, b, .3));
  const pts = []; for (const c of corners) pts.push(o, c);
  for (let i = 0; i < 4; i++) pts.push(corners[i], corners[(i + 1) % 4]);
  g.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({color:C.ir, transparent:true, opacity:.9})));
  const fr = new THREE.Mesh(new THREE.BufferGeometry().setFromPoints([o, corners[0], corners[1], o, corners[1], corners[2], o, corners[2], corners[3], o, corners[3], corners[0]]), glow(C.ir, .1)); g.add(fr);
}
{ const g = efx("imu");
  const c = V(0, 0, R.deckZ + R.deckT + 7);
  for (const [d, col] of [[V(1, 0, 0), 0xf08a6e], [V(0, 1, 0), 0x3cc9b5], [V(0, 0, 1), 0xe9eef0]]) g.add(new THREE.ArrowHelper(d, c, 12, col, 3, 1.6));
  g.userData.rings = [];
  for (let i = 0; i < 3; i++) { const r = new THREE.Mesh(new THREE.TorusGeometry(1, .12, 6, 40), glow(C.sonar, .7)); r.rotation.x = Math.PI / 2; r.position.copy(V(R.antX, 0, R.antTop)); g.add(r); g.userData.rings.push(r); }
}
{ const g = efx("dvl"); g.userData.rings = [];
  for (let i = 0; i < 3; i++) { const r = new THREE.Mesh(new THREE.TorusGeometry(1, .15, 6, 40), glow(0xe5a84a, .8)); r.rotation.x = Math.PI / 2; g.add(r); g.userData.rings.push(r); } }
{ const g = efx("drive"); g.userData.arrows = {};
  for (const [side, sy] of [["L", 1], ["R", -1]]) { const a = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), V(0, sy * (R.track / 2 + 6), 1), 10, C.sonar, 3, 2); g.add(a); g.userData.arrows[side] = a; } }

const solid = []; robot.traverse(n => { if (n.isMesh && n.userData.key && !(n.material instanceof THREE.MeshBasicMaterial)) solid.push(n); });
// ------------------------------------------------------------------ camera per beat
const ease = u => u < 0 ? 0 : u > 1 ? 1 : u * u * (3 - 2 * u);
const lerpV = (a, b, u) => a.clone().lerp(b, u);
function camFor(k, u, pz) {
  const rp = V(pz.x, pz.y, 0);
  const at = (px, py, pzz, tx, ty, tz) => ({pos:new THREE.Vector3(px, py, pzz), tgt:new THREE.Vector3(tx, ty, tz)});
  switch (k) {
    case "title": { const a = -2.2 + u * .12; return at(Math.cos(a) * 120, 40, Math.sin(a) * 120, 0, 28, 0); }
    case "overview": { const a = -1.5 + u * .14; return at(Math.cos(a) * 92, 46, Math.sin(a) * 92, 0, 10, 0); }
    case "wheels": return at(rp.x + 4, 17, -68 + u * .6, rp.x, 6, 0);
    case "spin": return at(50, 78, 62, 0, 4, 0);
    case "xray": { const a = -0.75 + u * .05, r = 50 - u * .9; return at(Math.cos(a) * r, 36 - u * .6, Math.sin(a) * r, 0, 7, 0); }
    case "sonar": return at(8 + u * 1.2, 150, 70, 0, 8, 0);
    case "ir": return at(105 + u * 1.5, 52, 82, 38, 8, 0);
    case "cliff": { const a = 2.1 + u * .05; return at(Math.cos(a) * 95, 85, Math.sin(a) * 95, 0, 0, 0); }
    case "bumper": return at(66, 20, -40 + u * 2, 18, 8, 0);
    case "camera": return at(46, 42, -118 + u * 1.5, 46, 8, 0);
    case "imu": { const a = -2.3 + u * .06, r = 58 - u * 1.5; return at(Math.cos(a) * r, 52, Math.sin(a) * r, -5, 20, 0); }
    case "drive": return at(rp.x - 85, 70, rp.z - 75, rp.x + 10, 6, rp.z);
    case "w1": { const a = .22 + u * .05, r = 66 - u * 2; return rel(pz, Math.cos(a) * r, 28, Math.sin(a) * r, -3, 12, 0); }
    case "w2": { const a = .5 + u * .06; return rel(pz, Math.cos(a) * 40, 100, Math.sin(a) * 40, 0, 12, 0); }
    case "w3": { const a = -.75 + u * .07; return rel(pz, Math.cos(a) * 88, 16, Math.sin(a) * 88, 0, 11, 0); }
    default: { const a = -2.2 + u * .1; return at(rp.x + Math.cos(a) * 170, 95, rp.z + Math.sin(a) * 170, rp.x, 10, rp.z); }
  }
}
// a camera given in the rover's own frame (x forward, y up, z to its right), placed in the world
function rel(pz, lx, ly, lz, tx, ty, tz) {
  const c = Math.cos(pz.h), s = Math.sin(pz.h), w = (x, y, z) => new THREE.Vector3(pz.x + x * c + z * s, y, -pz.y - x * s + z * c);
  return {pos:w(lx, ly, lz), tgt:w(tx, ty, tz)};
}
function cameraAt(t) {
  const i = beatAt(t), b = BEATS[i], u = t - b.t, pz = pose(t);
  const cur = camFor(b.k, u, pz);
  const T = 1.6;
  if (i > 0 && u < T) { const p = BEATS[i - 1], prev = camFor(p.k, p.d, pose(b.t)); const e = ease(u / T); return {pos:lerpV(prev.pos, cur.pos, e), tgt:lerpV(prev.tgt, cur.tgt, e)}; }
  return cur;
}

// ------------------------------------------------------------------ render(t)
const FADE = {wheels:["wheels"], spin:["wheels"], w1:["thruster"], w2:["sonar", "sonar12"], w3:["dvl", "pressure", "modem", "hull"], xray:["motors", "encoders", "battery"], sonar:["sonar"], ir:["ir"], cliff:["cliff"], bumper:["bumper"], camera:["camera"], imu:["imu", "antenna"]};
const FOCUS = {wheels:["wheels"], spin:["wheels"], w1:["thruster"], w2:["sonar12"], w3:["dvl", "pressure", "modem"], xray:["motors", "encoders", "battery"], sonar:["sonar"], ir:["ir"], cliff:["cliff"], bumper:["bumper"], camera:["camera"], imu:["imu", "antenna"], drive:["wheels"]};
const all = Object.values(parts).flat();
const fade = (t, a, b, f = .5) => Math.min(ease((t - a) / f), ease((b - t) / f));
const water = document.getElementById("water"), capWhy = document.getElementById("capWhy"), capAr = document.getElementById("capAr"), capEn = document.getElementById("capEn"), capNote = document.getElementById("capNote");
const cap = document.getElementById("cap"), chap = document.getElementById("chap"), title = document.getElementById("title");
let lastBeat = -1;
function render(t) {
  t = Math.max(0, Math.min(TOTAL - 1e-3, t));
  const i = beatAt(t), b = BEATS[i], pz = pose(t);
  robot.position.set(pz.x, 0, -pz.y); robot.rotation.y = pz.h;
  for (const w of wheels.L) w.rotation.z = -pz.al;
  for (const w of wheels.R) w.rotation.z = -pz.ar;
  // focus: the part being explained stays solid, everything else fades back
  const fk = FADE[b.k], d = fk ? fade(t, b.t, b.t + b.d, .7) : 0, low = b.k === "xray" ? .06 : /^w[123]$/.test(b.k) ? .3 : .14;
  for (const m of solid) {
    const on = fk && fk.includes(m.userData.key);
    let o = on ? 1 : 1 - (1 - low) * d;
    if (m.userData.inside) o = b.k === "xray" ? (on ? d : low * d) : 0;
    m.material.opacity = o; m.material.depthWrite = o > .95; m.visible = o > .01;
  }
  // highlight
  const f = FOCUS[b.k] || [], pulse = .5 + .5 * Math.sin(t * 5.2);
  for (const m of all) m.material.emissiveIntensity = 1;
  for (const m of all) { if (m.userData.e0 === undefined) m.userData.e0 = m.material.emissive.getHex(); m.material.emissive.setHex(m.userData.e0); }
  for (const k of f) for (const m of (parts[k] || [])) { m.material.emissive.setHex(0x1d6b60); m.material.emissiveIntensity = .15 + .35 * pulse; }
  // effects
  const show = (k, a, z) => { const g = fx[k], o = fade(t, a, z); g.visible = o > .01; g.traverse(n => { if (n.material) { n.userData.o0 = n.userData.o0 ?? n.material.opacity; n.material.opacity = n.userData.o0 * o; n.material.transparent = true; } }); };
  for (const k of ["sonar", "ir", "cliff", "camera", "imu"]) show(k, BK[k].t, BK[k].t + BK[k].d); show("drive", BK.drive.t + .5, BK.drive.t + BK.drive.d);
  fx.sonar.userData.echo.forEach((e, k) => { const ph = (Math.max(0, t - BK.sonar.t) * .8 + k * .07) % 1; e.position.x = 2 + ph * 58; const s = 1 + ph * 7; e.scale.set(s, s, s); e.material.opacity = (1 - ph) * .8 * fade(t, BK.sonar.t, BK.sonar.t + BK.sonar.d); });
  // underwater: the rover turns into the underwater vehicle, one change at a time, and stays that way
  const wf = s => ease((t - s) / 2.4), W1 = wf(BK.w1.t), W2 = wf(BK.w2.t), W3 = wf(BK.w3.t);
  const sz = (o, k) => { o.scale.copy(o.userData.base || (o.userData.base = o.scale.clone())).multiplyScalar(Math.max(.001, k)); if (k <= .01) o.visible = false; };
  for (const g of [...wheels.L, ...wheels.R]) { g.visible = true; sz(g, 1 - W1); }
  for (const g of thrusterGroups) { g.visible = true; sz(g, W1); }
  for (const m of [...parts.ir, ...parts.cliff, ...sonarHeads]) sz(m, 1 - W2);
  for (const m of parts.sonar12) sz(m, W2);
  for (const m of [dvl, pressure, modem]) sz(m, W3);
  hull.scale.copy(hull.userData.base).multiplyScalar(Math.max(.001, W3)); hull.visible = W3 > .01; hull.material.opacity = .28 * W3; hull.material.depthWrite = false;
  for (const m of parts.antenna) sz(m, 1 - W3);
  for (const p of props) p.rotation.x = t * 9;
  robot.position.y = 6 * W1;                                   // it floats
  water.style.opacity = String(W1);
  fx.dvl.visible = W3 > .01; fx.dvl.position.copy(dvl.position);
  fx.dvl.userData.rings.forEach((r, k) => { const ph = ((t - BK.w3.t) * .8 + k / 3 + 3) % 1; r.position.y = -1 - ph * 8; const s = 1.5 + ph * 4; r.scale.set(s, s, s); r.material.opacity = (1 - ph) * .8 * W3; });
  fx.imu.userData.rings.forEach((r, k) => { const ph = (Math.max(0, t - BK.imu.t) * .7 + k / 3) % 1; const s = 1 + ph * 8; r.scale.set(s, s, s); r.material.opacity = (1 - ph) * .7 * fade(t, BK.imu.t, BK.imu.t + BK.imu.d); });
  { const s = segAt(t), v = s ? s[2] : 0, w = s ? s[3] : 0;
    const wl = (v - w * R.track / 2) / R.wheelR, wr = (v + w * R.track / 2) / R.wheelR;
    for (const [side, sp] of [["L", wl], ["R", wr]]) { const a = fx.drive.userData.arrows[side]; const L = Math.max(.01, Math.abs(sp) * 2.2); a.setDirection(new THREE.Vector3(Math.sign(sp) || 1, 0, 0)); a.setLength(L, Math.min(3, L * .5), 2); } }
  // bumpers blink only in their beat, three times a second at most
  if (b.k === "bumper") for (const m of parts.bumper) { m.material.emissive.setHex(0x7a2b18); m.material.emissiveIntensity = (Math.sin(t * Math.PI * 2 * 1.2) > 0) ? 1.2 : .2; }
  // camera
  const c = cameraAt(t); cam.position.copy(c.pos); cam.lookAt(c.tgt);
  renderer.render(scene, cam);
  // captions
  title.style.opacity = String(fade(t, -1, 5.6, .8));
  cap.style.opacity = String(b.ar ? fade(t, b.t + .3, b.t + b.d - .1, .45) : 0);
  if (i !== lastBeat) { capAr.textContent = b.ar; capWhy.textContent = b.why || ""; capWhy.hidden = !b.why; capEn.textContent = b.en; capNote.textContent = b.note; capNote.hidden = !b.note; chap.textContent = b.chap; lastBeat = i; }
  chap.style.opacity = String(b.chap ? 1 : 0);
}

// ------------------------------------------------------------------ sizing + player
function size() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
addEventListener("resize", () => { size(); render(now); });
size();
const rec = new URLSearchParams(location.search).has("rec");
if (rec) { document.body.classList.add("rec"); renderer.setPixelRatio(1); size(); }
let now = 0, playing = !rec, last = performance.now();
const seek = document.getElementById("seek"), timeEl = document.getElementById("time"), play = document.getElementById("play");
seek.max = TOTAL;
play.onclick = () => { playing = !playing; play.textContent = playing ? "إيقاف" : "تشغيل"; if (playing && now >= TOTAL - .01) now = 0; };
seek.oninput = () => { now = +seek.value; render(now); };
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
function loop(t) {
  const dt = Math.min(.1, (t - last) / 1000); last = t;
  if (playing) { now += dt; if (now >= TOTAL) { now = TOTAL; playing = false; play.textContent = "تشغيل"; } render(now); seek.value = now; timeEl.textContent = `${fmt(now)} / ${fmt(TOTAL)}`; }
  requestAnimationFrame(loop);
}
window.__total = TOTAL;
window.__seek = t => { render(t); return true; };
render(0);
if (!rec) requestAnimationFrame(loop);
})();
</script>
